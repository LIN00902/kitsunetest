        <h1>狐日和の物語</h1>




        <div class="background_picture-font">
            <img src="./picture/memo02.jpg">
   
        <div class="background_font">
            <p>「這裡都是好天氣呢！」</p>
            <p>村長遞過豆皮壽司給我。叼著村長的得意料理、望著車站外的大晴天，</p>
            <p> 不禁讚嘆狐狸村「百日晴空」的傳說，在上個站還是狂風暴雨呢。</p>
            <p>選定了太陽曬暖的位子坐下，放下背包拿出畫具。</p>
            <p>村長看著外頭，「這幅作品你打算要畫什麼主題啊？」</p>
            <p>曬著暖陽閉眼想了想。</p>
            <p>「『狐日和』。」</p>
